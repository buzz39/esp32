<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>NeoClone pendant - breadboard wiring</title>
  <rect width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2328">NeoClone pendant — breadboard wiring</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#57606a">Verified working 18 Oct 2026 · ESP32-C3 Super Mini + INMP441 + microSD (SPI) + push button</text>

  <!-- ===== ESP32-C3 Super Mini ===== -->
  <rect x="470" y="118" width="60" height="22" rx="3" fill="#d0d7de" stroke="#57606a"/>
  <text x="500" y="133" text-anchor="middle" font-size="11" fill="#1f2328">USB-C</text>
  <rect x="400" y="140" width="200" height="400" rx="8" fill="#24292f" stroke="#1f2328"/>
  <text x="500" y="345" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">ESP32-C3</text>
  <text x="500" y="365" text-anchor="middle" font-size="13" fill="#d0d7de">Super Mini</text>

  <!-- left pin stubs + labels -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="370" y1="180" x2="400" y2="180"/><line x1="370" y1="228" x2="400" y2="228"/>
    <line x1="370" y1="276" x2="400" y2="276"/><line x1="370" y1="324" x2="400" y2="324"/>
    <line x1="370" y1="372" x2="400" y2="372"/><line x1="370" y1="420" x2="400" y2="420"/>
    <line x1="370" y1="468" x2="400" y2="468"/><line x1="370" y1="516" x2="400" y2="516"/>
  </g>
  <g font-size="12" fill="#ffffff">
    <text x="408" y="184">GPIO5</text><text x="408" y="232">GPIO6</text>
    <text x="408" y="280">GPIO7</text><text x="408" y="328">GPIO8</text>
    <text x="408" y="376">GPIO9</text><text x="408" y="424">GPIO10</text>
    <text x="408" y="472">GPIO20</text><text x="408" y="520">GPIO21</text>
  </g>
  <!-- right pin stubs + labels -->
  <g stroke="#57606a" stroke-width="2">
    <line x1="600" y1="180" x2="630" y2="180"/><line x1="600" y1="228" x2="630" y2="228"/>
    <line x1="600" y1="276" x2="630" y2="276"/><line x1="600" y1="324" x2="630" y2="324"/>
    <line x1="600" y1="372" x2="630" y2="372"/><line x1="600" y1="420" x2="630" y2="420"/>
    <line x1="600" y1="468" x2="630" y2="468"/><line x1="600" y1="516" x2="630" y2="516"/>
  </g>
  <g font-size="12" fill="#ffffff" text-anchor="end">
    <text x="592" y="184">5V</text><text x="592" y="232">GND</text>
    <text x="592" y="280">3V3</text><text x="592" y="328">GPIO4</text>
    <text x="592" y="376">GPIO3</text><text x="592" y="424">GPIO2</text>
    <text x="592" y="472">GPIO1</text><text x="592" y="520">GPIO0</text>
  </g>
  <!-- breadboard row numbers -->
  <g font-size="10" fill="#8c959f">
    <text x="372" y="174">row 1</text><text x="372" y="222">row 2</text><text x="372" y="270">row 3</text><text x="372" y="318">row 4</text>
    <text x="602" y="174">row 1</text><text x="602" y="222">row 2</text><text x="602" y="270">row 3</text><text x="602" y="318">row 4</text>
    <text x="602" y="366">row 5</text><text x="602" y="414">row 6</text><text x="602" y="462">row 7</text><text x="602" y="510">row 8</text>
  </g>
  <text x="462" y="328" font-size="10" fill="#8c959f">· LED</text>

  <!-- ===== microSD module ===== -->
  <rect x="80" y="160" width="170" height="330" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="165" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#0a3069">microSD module</text>
  <text x="165" y="418" text-anchor="middle" font-size="12" fill="#0a3069">SPI · has 3.3 V regulator</text>
  <text x="165" y="436" text-anchor="middle" font-size="12" fill="#0a3069">FAT32 card</text>
  <g font-size="12" fill="#0a3069" text-anchor="end">
    <text x="242" y="184">MOSI</text><text x="242" y="232">SCK</text><text x="242" y="280">CS</text>
    <text x="242" y="328">MISO</text><text x="242" y="352">VCC</text><text x="242" y="472">GND</text>
  </g>
  <g stroke="#0969da" stroke-width="2.5" fill="none">
    <line x1="250" y1="180" x2="370" y2="180"/>
    <line x1="250" y1="228" x2="370" y2="228"/>
    <line x1="250" y1="276" x2="370" y2="276"/>
    <line x1="250" y1="324" x2="300" y2="324"/>
  </g>
  <line x1="250" y1="348" x2="300" y2="348" stroke="#cf222e" stroke-width="2.5"/>
  <!-- net flags on SD side -->
  <polygon points="300,316 350,316 358,324 350,332 300,332" fill="#fff8c5" stroke="#9a6700"/>
  <text x="325" y="328" text-anchor="middle" font-size="11" fill="#633c01">GPIO4</text>
  <polygon points="300,340 350,340 358,348 350,356 300,356" fill="#ffebe9" stroke="#cf222e"/>
  <text x="325" y="352" text-anchor="middle" font-size="11" fill="#82071e">5V</text>
  <!-- SD ground -->
  <line x1="250" y1="468" x2="290" y2="468" stroke="#1f2328" stroke-width="2.5"/>
  <line x1="290" y1="468" x2="290" y2="486" stroke="#1f2328" stroke-width="2.5"/>
  <g stroke="#1f2328" stroke-width="2"><line x1="278" y1="486" x2="302" y2="486"/><line x1="282" y1="492" x2="298" y2="492"/><line x1="286" y1="498" x2="294" y2="498"/></g>

  <!-- ===== right-side nets from ESP32 ===== -->
  <line x1="630" y1="180" x2="660" y2="180" stroke="#cf222e" stroke-width="2.5"/>
  <polygon points="660,172 720,172 728,180 720,188 660,188" fill="#ffebe9" stroke="#cf222e"/>
  <text x="694" y="184" text-anchor="middle" font-size="11" fill="#82071e">SD VCC</text>

  <line x1="630" y1="228" x2="650" y2="228" stroke="#1f2328" stroke-width="2.5"/>
  <line x1="650" y1="228" x2="650" y2="242" stroke="#1f2328" stroke-width="2.5"/>
  <g stroke="#1f2328" stroke-width="2"><line x1="638" y1="242" x2="662" y2="242"/><line x1="642" y1="248" x2="658" y2="248"/><line x1="646" y1="254" x2="654" y2="254"/></g>

  <line x1="630" y1="324" x2="660" y2="324" stroke="#9a6700" stroke-width="2.5"/>
  <polygon points="660,316 728,316 736,324 728,332 660,332" fill="#fff8c5" stroke="#9a6700"/>
  <text x="698" y="328" text-anchor="middle" font-size="11" fill="#633c01">SD MISO</text>

  <!-- 3V3 -> mic VDD -->
  <line x1="630" y1="276" x2="800" y2="276" stroke="#cf222e" stroke-width="2.5"/>
  <!-- GPIO3 -> mic SD -->
  <line x1="630" y1="372" x2="800" y2="372" stroke="#8250df" stroke-width="2.5"/>
  <!-- GPIO1 -> mic WS -->
  <line x1="630" y1="468" x2="800" y2="468" stroke="#8250df" stroke-width="2.5"/>
  <!-- GPIO0 -> mic SCK -->
  <line x1="630" y1="516" x2="800" y2="516" stroke="#8250df" stroke-width="2.5"/>

  <!-- GPIO2 -> button -> GND -->
  <line x1="630" y1="420" x2="690" y2="420" stroke="#1a7f37" stroke-width="2.5"/>
  <circle cx="694" cy="420" r="4" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <circle cx="734" cy="420" r="4" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <line x1="692" y1="406" x2="736" y2="406" stroke="#1a7f37" stroke-width="2.5"/>
  <line x1="714" y1="406" x2="714" y2="396" stroke="#1a7f37" stroke-width="2.5"/>
  <line x1="704" y1="396" x2="724" y2="396" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="714" y="388" text-anchor="middle" font-size="11" fill="#116329">button</text>
  <line x1="738" y1="420" x2="760" y2="420" stroke="#1f2328" stroke-width="2.5"/>
  <line x1="760" y1="420" x2="760" y2="434" stroke="#1f2328" stroke-width="2.5"/>
  <g stroke="#1f2328" stroke-width="2"><line x1="748" y1="434" x2="772" y2="434"/><line x1="752" y1="440" x2="768" y2="440"/><line x1="756" y1="446" x2="764" y2="446"/></g>

  <!-- ===== INMP441 mic ===== -->
  <rect x="800" y="170" width="150" height="370" rx="8" fill="#fbefff" stroke="#8250df"/>
  <text x="875" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#3e1f79">INMP441</text>
  <text x="875" y="428" text-anchor="middle" font-size="12" fill="#3e1f79">I2S MEMS mic</text>
  <text x="875" y="446" text-anchor="middle" font-size="12" fill="#3e1f79">left channel</text>
  <g font-size="12" fill="#3e1f79">
    <text x="808" y="204">GND</text><text x="808" y="242">L/R</text><text x="808" y="280">VDD</text>
    <text x="808" y="376">SD</text><text x="808" y="472">WS</text><text x="808" y="520">SCK</text>
  </g>
  <!-- mic GND + L/R to ground -->
  <line x1="800" y1="200" x2="770" y2="200" stroke="#1f2328" stroke-width="2.5"/>
  <line x1="800" y1="238" x2="770" y2="238" stroke="#1f2328" stroke-width="2.5"/>
  <line x1="770" y1="200" x2="770" y2="250" stroke="#1f2328" stroke-width="2.5"/>
  <circle cx="770" cy="238" r="3.5" fill="#1f2328"/>
  <g stroke="#1f2328" stroke-width="2"><line x1="758" y1="250" x2="782" y2="250"/><line x1="762" y1="256" x2="778" y2="256"/><line x1="766" y1="262" x2="774" y2="262"/></g>

  <!-- ===== notes ===== -->
  <g font-size="12.5" fill="#1f2328">
    <text x="60" y="580">• Breadboard: ESP32 straddles the centre groove, USB at top → pins in rows 1–8. Right column top→bottom: 5V, G, 3.3, 4, 3, 2, 1, 0. Left: 5, 6, 7, 8, 9, 10, 20, 21.</text>
    <text x="60" y="600">• SD module VCC goes to <tspan font-weight="bold">5V</tspan> (it has its own 3.3 V regulator). Mic VDD goes to <tspan font-weight="bold">3V3</tspan> — never 5V.</text>
    <text x="60" y="620">• Mic L/R tied to GND = left channel (I2S slot A). Its 2×3 pins straddle the groove — never put it in one half (pins would short in pairs).</text>
    <text x="60" y="640">• Button uses diagonally opposite legs. Ground symbol = any GND (ESP32 "G", row 2 right). Firmware: firmware/pendant_recorder (core 3.x, USB CDC On Boot = Enabled).</text>
  </g>
</svg>
